---
name: Build
description: Build the project using a Docker container
inputs:
  docker_image:
    description: Docker image to use for the build job
    required: true
  kas_file:
    description: KAS file to use for the build job
    required: true
  machine_name:
    description: Yocto MACHINE name to use for artifact paths
    required: true
  image_name:
    description: Yocto image name to use for artifact paths
    required: true
  build_command:
    description: Command to run for the build
    required: false
    default: "bitbake qcom-multimedia-proprietary-image"
  build_type:
    description: Type of build to perform (flat_build or sdk_build)
    required: false
    default: "flat_build"
  build_matrix:
    description: Build matrix containing configuration
    required: true
  docker_cpus:
    description: CPU quota for docker build container
    required: false
    default: "48"
  docker_memory:
    description: Memory limit for docker build container
    required: false
    default: "96g"
  bitbake_threads:
    description: BB_NUMBER_THREADS value used during builds
    required: false
    default: "24"
  parallel_make:
    description: "PARALLEL_MAKE value used during builds (example: -j24)"
    required: false
    default: "-j 4"
  sstate_cache_dir:
    description: "Base directory for SSTATE_DIR and DL_DIR caches (default: /efs/qli/meta-audioreach)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Initialize env (MACHINE, file list)
      shell: bash
      run: |
        #!/bin/bash
        set -e
        echo "MACHINE=${{ inputs.machine_name }}" >> $GITHUB_ENV
        KAS_BASE="$(basename "${{ inputs.kas_file }}")"
        ARTIFACT_KEY="${KAS_BASE%.*}"
        echo "ARTIFACT_KEY=${ARTIFACT_KEY}" >> $GITHUB_ENV
        echo "ARTIFACT_KEY_BASENAME=${ARTIFACT_KEY}" >> $GITHUB_ENV
        filepath="${{ github.workspace }}/${{ inputs.machine_name }}_${{ inputs.build_type }}_${ARTIFACT_KEY}_file_list.txt"
        echo "filepath=${filepath}" >> $GITHUB_ENV
        : > "$filepath"

    - name: Setup sstate and download cache directories
      id: sstate_cache
      shell: bash
      env:
        CACHE_BASE: ${{ inputs.sstate_cache_dir }}
      run: |
        #!/bin/bash
        set -euo pipefail
        sstate_dir=""
        dl_dir=""
        mount_args=""
        if [ -n "${CACHE_BASE}" ]; then
          case "${CACHE_BASE}" in
            /*) ;;
            *) echo "::error::sstate_cache_dir must be an absolute path: ${CACHE_BASE}"; exit 1 ;;
          esac
          case "${CACHE_BASE}" in
            *[!A-Za-z0-9/._-]*)
              echo "::error::sstate_cache_dir may only contain [A-Za-z0-9/._-]"; exit 1 ;;
          esac
          base="${CACHE_BASE%/}"
          sstate_dir="${base}/sstate-cache"
          dl_dir="${base}/downloads"
          mkdir -p "${sstate_dir}" "${dl_dir}"
          mount_args="-v ${sstate_dir}:${sstate_dir} -v ${dl_dir}:${dl_dir}"
        fi
        {
          printf 'sstate_dir=%s\n' "${sstate_dir}"
          printf 'dl_dir=%s\n' "${dl_dir}"
          printf 'mount_args=%s\n' "${mount_args}"
        } >> "$GITHUB_OUTPUT"

    - name: Build ${{ env.MACHINE }}
      shell: bash
      env:
        SSTATE_CACHE_MOUNT: ${{ steps.sstate_cache.outputs.mount_args }}
        SSTATE_DIR_HOST: ${{ steps.sstate_cache.outputs.sstate_dir }}
        DL_DIR_HOST: ${{ steps.sstate_cache.outputs.dl_dir }}
      run: |
        #!/bin/bash
        set -e
        filepath="${{ github.workspace }}/${{ env.MACHINE }}_${{ inputs.build_type }}_${{ env.ARTIFACT_KEY }}_file_list.txt"
        echo "filepath=${filepath}" >> $GITHUB_ENV
        touch $filepath
        USER_ID=$(id -u)
        GROUP_ID=$(id -g)
        USER=$(whoami)
        WORKSPACE=${{ github.workspace }}/..
        USER_HOME="/home/$USER"
        echo "::group::$(printf '__________ %-100s' 'build' | tr ' ' _)"
        docker run \
          --rm \
          --user $(id -u):$(id -g) \
          -v ${WORKSPACE}:${USER_HOME}/workspace \
          -w ${USER_HOME}/workspace \
          ${SSTATE_CACHE_MOUNT} \
          --privileged \
          --cpus=${{ inputs.docker_cpus }} \
          --memory=${{ inputs.docker_memory }} \
          --ulimit nofile=1048576:1048576 \
          ${{ inputs.docker_image }} \
          bash -c "
            set -e
            kas shell ${{ inputs.kas_file }} -c '
              umask 022
              export BB_NUMBER_THREADS=\"${{ inputs.bitbake_threads }}\"
              export PARALLEL_MAKE=\"${{ inputs.parallel_make }}\"
              export CARGO_BUILD_JOBS=\"${{ inputs.bitbake_threads }}\"
              ${SSTATE_DIR_HOST:+export SSTATE_DIR=\"${SSTATE_DIR_HOST}\"}
              ${DL_DIR_HOST:+export DL_DIR=\"${DL_DIR_HOST}\"}
              ${{ inputs.build_command }}
            '
          "
        echo "::endgroup::"

    - name: Create tar archive for the build
      if: ${{ inputs.build_type == 'flat_build' }}
      shell: bash
      run: |
        #!/bin/bash
        set -ex
        KAS_FILE="${{ inputs.kas_file }}"
        KAS_FILE="${KAS_FILE##*/}"
        KAS_FILE="${KAS_FILE%.*}"
        IMAGE_NAME="${{ inputs.image_name }}"
        MACHINE=${{ env.MACHINE }}
        
        cd ..
        BUILD_DIR=build
        PUB_DIR=${{ github.workspace }}/pub/${MACHINE}/flat_build
        mkdir -p "$PUB_DIR"
        
        cd "$BUILD_DIR/tmp/deploy/images/${IMAGE_NAME}"
        
        # Handle different image types
        if [ "$MACHINE" = "raspberrypi4" ]; then
          # For Raspberry Pi
          if [ -f "${IMAGE_NAME}-${MACHINE}.tar.bz2" ]; then
            cp "${IMAGE_NAME}-${MACHINE}.tar.bz2" "$PUB_DIR/${IMAGE_NAME}-${KAS_FILE}.tar.bz2"
            echo "${PUB_DIR}/${IMAGE_NAME}-${KAS_FILE}.tar.bz2" >> ${{ env.filepath }}
          
          fi
        else
          # For QCOM devices
          
          cp "qcom-multimedia-proprietary-image-${IMAGE_NAME}.rootfs.qcomflash.tar.gz" "$PUB_DIR/qcom-multimedia-proprietary-image-${KAS_FILE}.rootfs.qcomflash.tar.gz"
          echo "${PUB_DIR}/qcom-multimedia-proprietary-image-${KAS_FILE}.rootfs.qcomflash.tar.gz" >> ${{ env.filepath }}

        fi
        
        ls -larth "$PUB_DIR"
        echo "Build artifacts created in $PUB_DIR"

    - name: copy the sdk to the pub directory
      if: ${{ inputs.build_type == 'sdk_build' }}
      shell: bash
      run: |
        #!/bin/bash
        set -ex
        KAS_FILE="${{ inputs.kas_file }}"
        KAS_FILE="${KAS_FILE##*/}"
        KAS_FILE="${KAS_FILE%.*}"
        MACHINE="${{ env.MACHINE }}"
        
        cd ..
        cd build/tmp/deploy/sdk/
        
        # Handle different SDK patterns
        if [ "$MACHINE" = "raspberrypi4" ]; then
          # For Raspberry Pi
          sdk_file=$(ls poky-*.sh || ls core-image-*.sh)
        else
          # For QCOM devices
          sdk_file=$(ls qcom-distro-*.sh)
        fi
        
        # Check if SDK file was found
        if [ -z "$sdk_file" ]; then
          echo "Error: No SDK file found for $MACHINE"
          echo "Contents of sdk directory:"
          ls -la
          exit 1
        fi
        
        PUB_DIR=${{ github.workspace }}/pub/${{ env.MACHINE }}/sdk_build
        mkdir -p $PUB_DIR
        cp $sdk_file $PUB_DIR/sdk-${KAS_FILE}.sh
        echo "${PUB_DIR}/sdk-${KAS_FILE}.sh" >> ${{ env.filepath }}
        ls -larth $PUB_DIR
        echo "SDK artifacts created in $PUB_DIR"

    - name: Upload artifacts
      uses: Audioreach/meta-audioreach/.github/actions/aws-s3-exchanger@master
      with:
        mode: multi-upload
        local_file: ${{ env.filepath }}
        s3_bucket: qli-prd-audior-gh-artifacts
      env:
        MACHINE: ${{ env.MACHINE }}
        BUILD_TYPE: ${{ inputs.build_type }}
        ARTIFACT_KEY: ${{ env.ARTIFACT_KEY }}
        ARTIFACT_KEY_BASENAME: ${{ env.ARTIFACT_KEY_BASENAME }}

    - name: Update Summary
      shell: bash
      run: |
        echo "## Build Summary for ${{ env.MACHINE }}" >> $GITHUB_STEP_SUMMARY
        echo '### :rocket: Build Successful!' >> $GITHUB_STEP_SUMMARY
        echo "- Machine: ${{ env.MACHINE }}" >> $GITHUB_STEP_SUMMARY
        echo "- Image: ${{ inputs.image_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- Config File: ${{ inputs.kas_file }}" >> $GITHUB_STEP_SUMMARY
        echo "- Build Type: ${{ inputs.build_type }}" >> $GITHUB_STEP_SUMMARY
        echo "- Build Command: ${{ inputs.build_command }}" >> $GITHUB_STEP_SUMMARY
